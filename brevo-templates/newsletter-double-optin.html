<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm WOW Hub</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f5f7;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f7;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:12px;padding:32px 28px;">
            <tr>
              <td style="font-size:22px;line-height:1.3;color:#151515;font-weight:600;">
                Confirm your WOW Hub subscription
              </td>
            </tr>
            <tr>
              <td style="padding-top:16px;font-size:16px;line-height:1.6;color:#444444;">
                Thanks for your interest in WOW Hub — ideas, insights, and practical ways to grow your business.
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;">
                <a
                  href="{{ doubleoptin }}"
                  style="display:inline-block;background:#292757;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:14px 28px;border-radius:8px;"
                >
                  Confirm subscription
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;font-size:13px;line-height:1.5;color:#808080;">
                If you did not request this email, you can ignore it. After confirming, you will be redirected to WOW Hub on our website.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
